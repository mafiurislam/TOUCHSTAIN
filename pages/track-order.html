<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - Getgozo</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div id="app-header"></div>

  <main class="container" style="padding-top:24px;padding-bottom:48px;">
    <h1 style="font-size:24px;font-weight:700;margin-bottom:16px;">📍 Order Tracking</h1>

    <!-- Order Search Form -->
    <div class="surface-card" style="margin-bottom:24px;">
      <form onsubmit="searchTrackOrder(event)"
        style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Order ID</label>
          <input type="text" id="trackOrderIdInput" class="form-control" placeholder="e.g. 100248" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="trackPhoneInput" class="form-control" value="+91 7679416294 / 7039214465">
        </div>
        <button type="submit" class="btn btn-primary" style="height:44px;">🔍 Track Order</button>
      </form>
    </div>

    <div id="trackOrderResultBox"></div>
  </main>

  <div id="app-footer"></div>

  <script src="../js/site-data.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const G = window.Getgozo;
      const orders = G.getOrders();
      const idParam = params.get('id') || (orders[0] && orders[0].id) || 100248;
      document.getElementById('trackOrderIdInput').value = idParam;
      renderTrackingDetails(idParam);
    });

    function searchTrackOrder(e) {
      e.preventDefault();
      const val = document.getElementById('trackOrderIdInput').value.replace('#', '').trim();
      renderTrackingDetails(val);
    }

    function renderTrackingDetails(orderId) {
      const G = window.Getgozo;
      const orders = G.getOrders();
      const ord = orders.find(o => String(o.id) === String(orderId)) || orders[0];
      const box = document.getElementById('trackOrderResultBox');
      if (!box || !ord) return;

      const steps = [
        { key: 'placed', title: 'Order Placed', sub: 'Your order has been placed successfully', icon: '../assets/image/order_placed.png', done: true },
        { key: 'accepted', title: 'Order Accepted', sub: 'Confirmed by TOUCHSTAINS Mumbai Main Hub', icon: '../assets/image/order_accepted.png', done: true },
        { key: 'preparing', title: 'Preparing Items', sub: 'Fresh items are being packed & quality checked', icon: '../assets/image/preparing_items.png', done: true },
        { key: 'on_way', title: 'Out for Delivery', sub: 'Delivery partner is on the way to your location', icon: '../assets/image/out_for_delivery.png', done: ord.status === 'delivered' || ord.status === 'confirmed' },
        { key: 'delivered', title: 'Order Delivered', sub: 'Delivered at doorstep', icon: '../assets/image/order_delivered.png', done: ord.status === 'delivered' }
      ];

      box.innerHTML = `
        <div class="surface-card">
          <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border-color);margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <div>
              <h2 style="font-size:19px;font-weight:700;">Order #${ord.id}</h2>
              <p style="font-size:13px;color:var(--text-medium);">Delivery Address: ${G.escapeHtml(ord.address)}</p>
            </div>
            <div style="text-align:right;">
              <div style="font-size:18px;font-weight:800;color:var(--primary);">Total: ₹${ord.total}</div>
              <small style="color:var(--text-light);">${G.escapeHtml(ord.paymentMethod)}</small>
            </div>
          </div>

          <!-- 5-Step GroFresh Timeline with Real Status Icons -->
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin-bottom:28px;">
            ${steps.map((s, idx) => `
              <div style="padding:16px;border-radius:var(--radius-md);border:1.5px solid ${s.done ? 'var(--primary)' : 'var(--border-color)'};background:${s.done ? 'var(--primary-light)' : 'var(--bg-muted)'};text-align:center;">
                <img src="${s.icon}" alt="${s.title}" style="width:46px;height:46px;object-fit:contain;margin:0 auto 10px;">
                <div style="font-size:13.5px;font-weight:700;color:${s.done ? 'var(--primary)' : 'var(--text-dark)'};">${idx + 1}. ${s.title}</div>
                <p style="font-size:11.5px;color:var(--text-medium);margin-top:4px;">${s.sub}</p>
              </div>
            `).join('')}
          </div>

          <!-- Live Branch Map Embed (Jadupr Branch Coordinates from API: 24.87886, 88.04068) -->
          <div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-color);">
            <div style="padding:12px 16px;background:var(--bg-muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
                <img src="../assets/image/delivery_boy_marker.png" alt="" style="width:22px;">
                <span>Dispatch Branch: Jadupr — Shop No. 3 & 4, Tower B, Braumonte, Road No. 28-A, Sion Koliwada, Sion, Mumbai, Maharashtra - 400022</span>
              </div>
              <a href="tel:+91 7679416294 / 7039214465" class="btn btn-primary btn-sm">📞 Call Support (+91 7679416294 / 7039214465)</a>
            </div>
            <iframe
              title="TOUCHSTAINS Mumbai Main Hub PAN India Delivery Map"
              width="100%"
              height="300"
              style="border:0;display:block;"
              loading="lazy"
              src="https://www.openstreetmap.org/export/embed.html?bbox=88.015%2C24.860%2C88.065%2C24.895&amp;layer=mapnik&amp;marker=24.87886%2C88.04068">
            </iframe>
          </div>
        </div>
      `;
    }
  </script>
</body>

</html>
