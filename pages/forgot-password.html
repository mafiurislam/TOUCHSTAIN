<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password & OTP Verification - Getgozo</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container" style="padding-top:36px;padding-bottom:56px;">
    <div class="surface-card" style="max-width:460px;margin:0 auto;padding:32px 26px;text-align:center;">
      <img src="../storage/restaurant/touchstains-logo.png?v=2.3" alt="TOUCHSTAINS" style="height:58px;margin:0 auto 14px;object-fit:contain;" onerror="this.src='../assets/image/touchstains-logo.png'">
      <h1 style="font-size:21px;font-weight:700;margin-bottom:6px;">Forgot Password / OTP Verification</h1>
      <p style="font-size:13px;color:var(--text-medium);margin-bottom:20px;">Enter your registered phone number or email to receive a 4-digit verification code.</p>

      <form id="stepSendOtpForm" onsubmit="sendResetOtp(event)" style="text-align:left;">
        <div class="form-group">
          <label class="form-label">Email or Phone Number *</label>
          <input type="text" id="fpPhoneOrEmail" class="form-control" required placeholder="+91 7679416294 / 7039214465 or touchstains@gmail.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Get OTP</button>
      </form>

      <form id="stepVerifyOtpForm" onsubmit="verifyResetOtp(event)" style="display:none;text-align:left;margin-top:16px;">
        <div class="form-group">
          <label class="form-label">Enter 4-Digit Verification Code</label>
          <input type="text" maxlength="4" class="form-control" required placeholder="1234" style="text-align:center;font-size:20px;letter-spacing:8px;font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Create New Password</label>
          <input type="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Verify & Save Password</button>
      </form>

      <p style="margin-top:18px;font-size:13px;">
        <a href="login.html" style="color:var(--primary);font-weight:600;">← Back to Login</a>
      </p>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../js/site-data.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function sendResetOtp(e) {
      e.preventDefault();
      document.getElementById('stepSendOtpForm').style.display = 'none';
      document.getElementById('stepVerifyOtpForm').style.display = 'block';
      window.Getgozo.showToast('Verification OTP sent! (Use 1234)', 'success');
    }
    function verifyResetOtp(e) {
      e.preventDefault();
      window.Getgozo.showToast('Password updated successfully!', 'success');
      setTimeout(() => window.location.href = 'login.html', 600);
    }
  </script>
</body>
</html>
